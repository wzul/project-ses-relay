services:
  app:
    build: .
    ports:
      - "${SMTP_PORT:-587}:587"
      # 3000 is routed by Dokploy/Traefik, not published here
    environment:
      - DB_PATH=/data/relay.db
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - SMTP_PORT=587
      - API_PORT=3000
      - SMTP_DOMAIN=${SMTP_DOMAIN:-smtp.yourdomain.com}
      - QUEUE_POLL_MS=${QUEUE_POLL_MS:-10000}
      - SES_GUARD=${SES_GUARD:-reject}
      - SES_GUARD_TTL_MS=${SES_GUARD_TTL_MS:-120000}
    volumes:
      - relay_data:/data
      - cert_data:/etc/letsencrypt:ro
    mem_limit: 128m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  certbot:
    image: certbot/dns-cloudflare
    entrypoint: /bin/sh
    working_dir: /
    volumes:
      - cert_data:/etc/letsencrypt
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    command: >
      -c "
      echo dns_cloudflare_api_token = $${CLOUDFLARE_API_TOKEN} > /etc/letsencrypt/cloudflare.ini &&
      chmod 600 /etc/letsencrypt/cloudflare.ini &&
      trap exit TERM; while :; do certbot renew --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini --quiet --deploy-hook 'chmod 755 /etc/letsencrypt/live /etc/letsencrypt/archive; chmod 640 /etc/letsencrypt/archive/*/privkey*.pem; chgrp -R 101 /etc/letsencrypt/live /etc/letsencrypt/archive'; sleep 12h & wait $${!}; done;
      "
    restart: always

volumes:
  relay_data:
  cert_data:
